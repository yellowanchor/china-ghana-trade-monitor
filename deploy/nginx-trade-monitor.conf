# Nginx 反向代理配置 — 中加贸易看板
# 安装方式（以 root 执行）：
#   cp deploy/nginx-trade-monitor.conf /etc/nginx/sites-available/
#   ln -sf /etc/nginx/sites-available/nginx-trade-monitor.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# HTTPS 证书（Let's Encrypt 免费自动签发）：
#   apt install certbot python3-certbot-nginx
#   certbot --nginx -d your-domain.com
#
# 将下方 your-domain.com 替换为你的实际域名（或用服务器 IP）

# 上游：trade-monitor Python 服务（仅本机可达）
upstream trade_monitor {
    server 127.0.0.1:8765;
}

server {
    listen 80;
    # listen 443 ssl;          # certbot 会自动加这两行
    # ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    server_name your-domain.com;   # ← 改成你的域名或 IP

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # 静态资源缓存（Vue/ECharts/Element Plus 已全部本地化，无 CDN）
    location ~* \.(js|css|woff2?|svg|jpg|png|ico)$ {
        proxy_pass http://trade_monitor;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # API 与页面
    location / {
        proxy_pass http://trade_monitor;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cookie 透传（登录会话）
        proxy_pass_request_headers on;
        proxy_set_header Cookie $http_cookie;
        # WebSocket 不需要（纯 HTTP 轮询），但留兼容
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 超时
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # 上传体积（合同 PDF / 图片）
        client_max_body_size 20m;
    }

    # HTTP → HTTPS 跳转（certbot 签发后自动生成此块）
    # if ($scheme != "https") {
    #     return 301 https://$host$request_uri;
    # }
}
