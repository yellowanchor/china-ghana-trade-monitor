<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 中加贸易智能分析</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#c8102e">
<!-- 主题预置：渲染前设好 .dark，避免闪烁 -->
<script>
(function () {
  try {
    var m = localStorage.getItem('tm-theme');
    var dark = m === 'dark' || (m !== 'light' && window.matchMedia
      && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.classList.add('dark');
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/css/login.css">
<link rel="stylesheet" href="/vendor/iconfont/iconfont.css">
</head>
<body>
<div id="auth" class="auth-card">
  <div class="auth-head">
    <span class="logo"><span class="iconfont icon-globe2"></span></span>
    <div>
      <div class="title">中加贸易智能分析</div>
      <div class="sub">China–Ghana Trade Monitor</div>
    </div>
  </div>

  <div class="tabs">
    <button :class="{active: tab==='login'}" @click="tab='login'">登录</button>
    <button :class="{active: tab==='register'}" @click="tab='register'">注册</button>
  </div>

  <!-- 登录 -->
  <form v-if="tab==='login'" @submit.prevent="login">
    <div class="field">
      <label>账号</label>
      <input v-model.trim="account" placeholder="请输入登录账号" autocomplete="username" />
    </div>
    <div class="field">
      <label>密码</label>
      <input v-model="password" type="password" placeholder="请输入密码" autocomplete="current-password" />
    </div>
    <button class="btn-primary" :disabled="loading">{{ loading ? '登录中…' : '登 录' }}</button>
  </form>

  <!-- 注册 -->
  <form v-else @submit.prevent="register">
    <div class="row2">
      <div class="field">
        <label>账号</label>
        <input v-model.trim="account" placeholder="4-20位字母/数字" autocomplete="username" />
      </div>
      <div class="field">
        <label>用户名</label>
        <input v-model.trim="username" placeholder="昵称" />
      </div>
    </div>
    <div class="field">
      <label>邮箱（用于接收验证码）</label>
      <input v-model.trim="email" placeholder="name@example.com" autocomplete="email" />
    </div>
    <div class="field">
      <label>手机号</label>
      <input v-model.trim="phone" placeholder="11 位手机号" autocomplete="tel" />
    </div>
    <div class="field">
      <label>密码</label>
      <input v-model="password" type="password" placeholder="≥8位，含字母和数字" autocomplete="new-password" />
    </div>
    <div class="field">
      <label>验证码</label>
      <div class="code-row">
        <input v-model.trim="code" placeholder="6 位验证码" />
        <button type="button" class="btn-code" :disabled="cooling" @click="sendCode">
          {{ cooling ? cooling + 's' : '获取验证码' }}
        </button>
      </div>
    </div>
    <button class="btn-primary" :disabled="loading">{{ loading ? '注册中…' : '注 册' }}</button>
  </form>

  <div v-if="msg" class="msg" :class="msgType">{{ msg }}</div>

  <div class="hint">受密码两级可逆加密保护 · 验证码接口已预留邮箱(Resend/Brevo/SMTP)与短信(阿里云/腾讯云)</div>
</div>

<script src="/vendor/vue.global.prod.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
