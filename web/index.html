<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中加贸易智能分析</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<meta name="theme-color" content="#c8102e">
<meta name="description" content="中加贸易智能分析看板">
<link rel="stylesheet" href="/vendor/element-plus/index.css">
<link rel="stylesheet" href="/vendor/iconfont/iconfont.css">
<link rel="stylesheet" href="/css/app.css">
<script>
/* 主题预置：在页面渲染前根据 localStorage / 系统偏好设置 dark 类，防止闪烁 */
(function () {
  try {
    var m = localStorage.getItem('tm-theme');
    var dark = m === 'dark' || (m !== 'light' && window.matchMedia
      && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.classList.add('dark');
  } catch (e) { /* localStorage 不可用时忽略，走默认浅色 */ }
})();
</script>
</head>
<body>
<div id="app"></div>
<script src="/vendor/vue.global.prod.js"></script>
<script src="/vendor/echarts.min.js"></script>
<script src="/vendor/element-plus/index.full.min.js"></script>
<script src="/vendor/icons/index.iife.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
